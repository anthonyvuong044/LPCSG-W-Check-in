  :root {
    --crimson: #850511;
    --crimson-2: #A3172A;
    --crimson-soft: #F6E1E4;
    --gold: #E8BE5A;
    --ink: #1C1C1E;
    --muted: #5C5C61;
    --faint: #8E8E93;
    --line: #ECE8E8;
    --field: #F4F2F2;
    --scrim: rgba(14, 22, 30, .42);
    --ease: cubic-bezier(.2, 0, 0, 1);
    --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: #fff; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4;
    display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }
  .wrap { width: min(760px, 100%); margin: 0 auto; }

  /* ===== Crimson header ===== */
  .hero {
    position: relative; overflow: hidden; color: #fff; flex: none;
    background:
      radial-gradient(120% 100% at 90% -10%, rgba(201, 52, 70, .55), rgba(201, 52, 70, 0) 55%),
      linear-gradient(180deg, #6A0410 0%, #850511 55%, #941021 100%);
    padding: 40px 32px 76px;
  }
  .stars i {
    position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--gold);
    opacity: .5; animation: twinkle 4s ease-in-out infinite;
  }
  .hero-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; position: relative; }
  .logo { justify-self: start; width: 156px; height: 156px; display: block; filter: drop-shadow(0 8px 18px rgba(40, 0, 5, .35)); }
  .title { text-align: center; }
  .hero-top .glass-pill { justify-self: end; }
  h1 { font-size: clamp(48px, 7vw, 68px); font-weight: 800; letter-spacing: -.035em; line-height: 1.02; }
  .sub { margin-top: 8px; font-size: 18px; font-weight: 500; color: rgba(255,255,255,.86); font-variant-numeric: tabular-nums; }
  .glass-pill {
    display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px 0 15px;
    border: 0; border-radius: 999px; background: rgba(255,255,255,.16); color: #fff;
    font-size: 15px; font-weight: 700; transition: background var(--fast, .16s) var(--ease), transform .15s var(--ease);
  }
  .glass-pill:hover { background: rgba(255,255,255,.24); }
  .glass-pill:active { transform: scale(.97); }
  .glass-pill svg { width: 18px; height: 18px; }
  .glass-pill:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ===== White sheet ===== */
  .sheet {
    flex: 1; position: relative; margin-top: -30px; background: #fff; border-radius: 28px 28px 0 0;
    padding: 30px 32px 32px; box-shadow: 0 -8px 30px rgba(60, 10, 15, .10);
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h2 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .tag { font-size: 13px; font-weight: 600; color: var(--muted); background: var(--field); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
  .sheet-sub { margin-top: 4px; color: var(--muted); font-size: 15px; }

  form { margin-top: 22px; }
  .field {
    display: flex; align-items: center; gap: 12px; height: 80px; padding: 0 24px;
    background: var(--field); border: 2px solid transparent; border-radius: 20px;
    transition: border-color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
  }
  .field svg { flex: none; width: 26px; height: 26px; color: var(--faint); transition: color .2s var(--ease); }
  .field:focus-within { background: #fff; border-color: var(--crimson); box-shadow: 0 0 0 5px rgba(133, 5, 17, .10); }
  .field:focus-within svg { color: var(--crimson); }
  .field.shake { animation: shake .4s ease; border-color: var(--crimson); }
  #wnum {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 32px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  #wnum::placeholder { color: #C4C0C0; font-weight: 600; }
  #wnum { padding: 0; }
  .prefix { flex: none; margin-right: -12px; font-size: 32px; font-weight: 700; letter-spacing: .08em; color: var(--ink); }
  .primary {
    margin-top: 16px; width: 100%; height: 66px; border: 0; border-radius: 999px;
    background: var(--crimson); color: #fff; font-size: 18px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 8px 20px rgba(133, 5, 17, .22);
    transition: background .2s var(--ease), transform .15s var(--ease);
  }
  .primary:hover { background: #6F0410; }
  .primary:active { transform: scale(.985); }
  .primary svg { width: 20px; height: 20px; }
  .hint { margin-top: 14px; text-align: center; font-size: 14px; color: var(--muted); min-height: 20px; }
  .hint.err { color: var(--crimson); font-weight: 700; }
  .warnbar { margin-top: 18px; text-align: center; font-size: 13px; font-weight: 700; color: var(--crimson); }

  .rise { animation: rise .55s var(--ease) both; }
  .d1 { animation-delay: .06s; } .d2 { animation-delay: .12s; } .d3 { animation-delay: .18s; }

  /* ===== Staff panel ===== */
  .scrim {
    position: fixed; inset: 0; z-index: 30; background: var(--scrim);
    opacity: 0; visibility: hidden; transition: opacity .25s var(--ease), visibility 0s linear .25s;
  }
  .scrim.open { opacity: 1; visibility: visible; transition: opacity .25s var(--ease); }
  .panel {
    position: fixed; z-index: 31; left: 50%; bottom: 0; width: min(640px, 100%); max-height: 86vh;
    display: flex; flex-direction: column; background: #fff; border-radius: 28px 28px 0 0;
    box-shadow: 0 -10px 40px rgba(22, 32, 43, .18);
    transform: translate(-50%, 105%); visibility: hidden;
    transition: transform .38s var(--ease), visibility 0s linear .38s;
  }
  .panel.open { transform: translate(-50%, 0); visibility: visible; transition: transform .38s var(--ease); }
  .grabber { width: 40px; height: 5px; border-radius: 3px; background: #D9D5D5; margin: 10px auto 0; }
  .p-head { display: flex; align-items: center; gap: 10px; padding: 14px 24px 0; }
  .p-head h2 { flex: 1; }
  .count-pill { font-size: 14px; font-weight: 700; color: var(--crimson); background: var(--crimson-soft); padding: 6px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .x { width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--field); color: var(--ink); display: grid; place-items: center; }
  .x:hover { background: #EAE6E6; }
  .x svg { width: 18px; height: 18px; }
  .p-search { margin: 16px 24px 4px; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 14px; background: var(--field); border: 2px solid transparent; }
  .p-search:focus-within { background: #fff; border-color: var(--crimson); }
  .p-search svg { width: 18px; height: 18px; color: var(--faint); flex: none; }
  .p-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; font-weight: 600; text-transform: uppercase; color: var(--ink); }
  .p-search input::placeholder { text-transform: none; font-weight: 500; color: var(--faint); }
  .list { list-style: none; padding: 4px 24px; overflow-y: auto; flex: 1; min-height: 120px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .tile { flex: none; width: 38px; height: 38px; border-radius: 11px; background: var(--crimson-soft); color: var(--crimson); display: grid; place-items: center; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .row b { flex: 1; font-size: 17px; font-weight: 700; letter-spacing: .05em; font-variant-numeric: tabular-nums; }
  .row span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .empty { padding: 28px 0; text-align: center; color: var(--muted); }
  .p-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 24px 20px; border-top: 1px solid var(--line); }
  .btn { height: 44px; padding: 0 18px; border: 0; border-radius: 999px; font-size: 14px; font-weight: 700; transition: background .2s var(--ease); }
  .btn.p { background: var(--crimson); color: #fff; }
  .btn.p:hover { background: #6F0410; }
  .btn.g { background: var(--field); color: var(--ink); }
  .btn.g:hover { background: #EAE6E6; }
  .btn.danger { background: #fff; color: var(--crimson); box-shadow: inset 0 0 0 1.5px var(--crimson); margin-left: auto; }
  .btn.danger:hover { background: var(--crimson-soft); }
  .p-note { padding: 0 24px 18px; margin-top: -8px; font-size: 12px; color: var(--faint); }

  /* ===== Full-screen flash ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center; color: #fff;
    opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s linear .25s;
  }
  .overlay.show { opacity: 1; visibility: visible; transition: opacity .14s ease; }
  .overlay.ok  { background: radial-gradient(circle at 50% 42%, #2FC46C, #138E45 78%); }
  .overlay.dup { background: radial-gradient(circle at 50% 42%, #B11A2B, #5E030C 78%); }
  .ov-card { padding: 24px; transform: scale(.92); transition: transform .4s cubic-bezier(.2, .9, .3, 1.25); }
  .overlay.show .ov-card { transform: scale(1); }
  .overlay.dup.show .ov-card { animation: shake .45s .1s ease; }
  .ring { width: 150px; height: 150px; margin: 0 auto 28px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; }
  .ring svg { width: 78px; height: 78px; overflow: visible; }
  .ring path { fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 120; stroke-dashoffset: 120; }
  .overlay.show .ring path { animation: draw .42s .12s ease-out forwards; }
  .overlay.show .ring path + path { animation-delay: .28s; }
  .icon-ok, .icon-dup { display: none; }
  .overlay.ok .icon-ok, .overlay.dup .icon-dup { display: block; }
  .ov-eyebrow { font-size: 20px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; opacity: .85; }
  .ov-title { margin-top: 8px; font-size: clamp(44px, 7vw, 72px); font-weight: 800; letter-spacing: -.035em; line-height: 1.05; }
  .ov-sub { margin-top: 14px; font-size: 20px; font-weight: 500; opacity: .9; }

  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .7; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); } 40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); } 80% { transform: translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
    .ring path { stroke-dashoffset: 0; }
  }
  @media (max-width: 640px) {
    .hero { padding: 24px 16px 58px; }
    .logo { width: 84px; height: 84px; }
    .sheet { padding: 26px 16px; }
    #wnum, .prefix { font-size: 24px; }
    .glass-pill span { display: none; }
    .glass-pill { padding: 0 14px; }
  }
</style>

        <div class="title">
          <h1>Check in</h1>
          <div class="sub" id="today">&nbsp;</div>
        </div>
        <button class="glass-pill" id="staffBtn" type="button" aria-label="Staff view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span>Staff</span>

  <main class="sheet">
    <div class="wrap">
      <div class="sheet-head rise d2">
        <h2>Your W number</h2>
        <span class="tag">Student ID</span>
      </div>
      <p class="sheet-sub rise d2">The W is already there. Just type your 8 digits.</p>

      <form id="form" autocomplete="off" class="rise d3">
        <label class="field" id="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16c.6-1.5 1.8-2.3 3.2-2.3s2.6.8 3.2 2.3M15 10h3M15 13.5h3"/></svg>
          <span class="prefix" aria-hidden="true">W</span>
          <input id="wnum" type="text" inputmode="numeric" spellcheck="false" placeholder="12345678" aria-label="W number digits" autofocus>
        </label>
        <button class="primary" type="submit">
          Check in
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <p class="hint" id="hint">Press Enter or tap Check in</p>
      </form>
      <p class="warnbar" id="warnbar" hidden>Storage is unavailable on this browser. Staff: export the list before closing.</p>
    </div>
  </main>

  <!-- Staff view: only opens from the Staff button -->
  <div class="scrim" id="scrim"></div>
  <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <div class="grabber"></div>
    <div class="p-head">
      <h2 id="pTitle">Check-ins</h2>
      <span class="count-pill" id="countPill">0 served</span>
      <button class="x" id="closeBtn" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <label class="p-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="search" type="text" spellcheck="false" placeholder="Search W numbers" aria-label="Search W numbers">
    </label>
    <ul class="list" id="list"></ul>
    <div class="p-foot">
      <button class="btn p" id="exportBtn" type="button">Export CSV</button>
      <button class="btn g" id="soundBtn" type="button">Sound: On</button>
      <button class="btn danger" id="resetBtn" type="button">Reset</button>
    </div>
    <p class="p-note" id="pNote">Saved on this computer. Closes by itself after a minute.</p>
  </section>

  <div class="overlay" id="overlay" aria-live="assertive">
    <div class="ov-card">
      <div class="ring">
        <svg class="icon-ok" viewBox="0 0 80 80"><path d="M18 42 L34 57 L63 24"/></svg>
        <svg class="icon-dup" viewBox="0 0 80 80"><path d="M22 22 L58 58"/><path d="M58 22 L22 58"/></svg>
      </div>
      <div class="ov-eyebrow" id="ovEyebrow"></div>
      <div class="ov-title" id="ovTitle"></div>
      <div class="ov-sub" id="ovSub"></div>
    </div>
  </div>

<script>
  // Format of a valid ID: "W" followed by 8 digits.
  const DIGITS = 8;
  const ID_PATTERN = new RegExp('^W\\d{' + DIGITS + '}$');
  const STORE_KEY = 'food-checkin-v1';
  const STAFF_TIMEOUT_MS = 60000;

  const $ = id => document.getElementById(id);
  const form = $('form'), input = $('wnum'), field = $('field'), hint = $('hint');
  const overlay = $('overlay'), panel = $('panel'), scrim = $('scrim'), search = $('search');

  let storageOk = true;
  let entries = load();                                  // [{ id, t }]
  const seen = new Map(entries.map(e => [e.id, e.t]));
  let soundOn = true;

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch { storageOk = false; return []; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); storageOk = true; }
    catch { storageOk = false; }
    $('warnbar').hidden = storageOk;
  }

  function normalize(raw) {
    let s = raw.toUpperCase().replace(/[\s-]/g, '');
    if (/^\d+$/.test(s)) s = 'W' + s;   // allow typing just the digits
    return s;
  }
  const fmtTime = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const fmtDay = t => new Date(t).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();

  // ===== Check-in =====
  // The W is shown in front of the box, so the box only ever holds up to 8 digits (works with a number keypad).
  // Anything else typed or pasted (keypad + - * / . included) is dropped.
  input.addEventListener('input', () => {
    const clean = input.value.replace(/\D/g, '').slice(0, DIGITS);
    if (input.value !== clean) input.value = clean;
    if (hint.classList.contains('err')) setHint('Press Enter or tap Check in');
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    const id = normalize(input.value);
    if (!id) return;

    if (!ID_PATTERN.test(id)) {
      setHint('Type all ' + DIGITS + ' digits of your W number.', true);
      field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake');
      beep('err');
      input.select();
      return;
    }

    input.value = '';
    setHint('Press Enter or tap Check in');

    if (seen.has(id)) {
      const t = seen.get(id);
      const when = sameDay(t, Date.now()) ? 'today at ' + fmtTime(t) : fmtDay(t) + ' at ' + fmtTime(t);
      flash('dup', id, 'Already collected', 'This W number got food ' + when, 2400);
      beep('dup');
      return;
    }

    const t = Date.now();
    entries.push({ id, t });
    seen.set(id, t);
    save();
    flash('ok', id, 'You’re checked in!', 'Enjoy your meal', 1300);
    beep('ok');
  });

  let hideTimer;
  function flash(kind, id, title, sub, ms) {
    $('ovEyebrow').textContent = id;
    $('ovTitle').textContent = title;
    $('ovSub').textContent = sub;
    overlay.classList.remove('show', 'ok', 'dup');
    void overlay.offsetWidth;                // restart animations on back-to-back check-ins
    overlay.classList.add(kind, 'show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => overlay.classList.remove('show'), ms);
  }

  function setHint(text, isErr) {
    hint.textContent = text;
    hint.classList.toggle('err', !!isErr);
  }

  // ===== Staff panel =====
  let staffTimer;
  const isStaffOpen = () => panel.classList.contains('open');

  function openStaff() {
    search.value = '';
    renderList();
    panel.classList.add('open');
    scrim.classList.add('open');
    search.focus();
    keepStaffOpen();
  }
  function closeStaff() {
    panel.classList.remove('open');
    scrim.classList.remove('open');
    clearTimeout(staffTimer);
    input.focus();
  }
  function keepStaffOpen() {                 // closes itself so numbers aren't left on screen
    clearTimeout(staffTimer);
    staffTimer = setTimeout(closeStaff, STAFF_TIMEOUT_MS);
  }

  function renderList() {
    const n = entries.length;
    $('countPill').textContent = n.toLocaleString() + ' served';
    const q = search.value.toUpperCase().replace(/[\s-]/g, '');
    const list = $('list');
    list.innerHTML = '';
    const rows = entries.map((e, i) => ({ ...e, n: i + 1 })).filter(e => e.id.includes(q)).reverse();
    if (!rows.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = n ? 'No matches.' : 'No check-ins yet.';
      list.append(li);
      return;
    }
    const frag = document.createDocumentFragment();
    rows.forEach(e => {
      const li = document.createElement('li');
      li.className = 'row';
      const tile = document.createElement('span'); tile.className = 'tile'; tile.textContent = e.n;
      const b = document.createElement('b'); b.textContent = e.id;
      const when = document.createElement('span');
      when.textContent = sameDay(e.t, Date.now()) ? fmtTime(e.t) : fmtDay(e.t) + ', ' + fmtTime(e.t);
      li.append(tile, b, when);
      frag.append(li);
    });
    list.append(frag);
  }

  $('staffBtn').addEventListener('click', openStaff);
  $('closeBtn').addEventListener('click', closeStaff);
  scrim.addEventListener('click', closeStaff);
  search.addEventListener('input', renderList);
  ['pointerdown', 'keydown', 'input', 'wheel'].forEach(ev => panel.addEventListener(ev, keepStaffOpen));

  $('soundBtn').addEventListener('click', () => {
    soundOn = !soundOn;
    $('soundBtn').textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
  });

  $('exportBtn').addEventListener('click', () => {
    const rows = [['#', 'W Number', 'Date', 'Time']].concat(
      entries.map((e, i) => [i + 1, e.id, new Date(e.t).toLocaleDateString(), new Date(e.t).toLocaleTimeString()]));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'food-checkins-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('resetBtn').addEventListener('click', () => {
    const answer = prompt('This erases all ' + entries.length + ' check-ins. Export first if you need them.\n\nType RESET to confirm:');
    if (answer && answer.trim().toUpperCase() === 'RESET') {
      entries = [];
      seen.clear();
      save();
      renderList();
    }
    keepStaffOpen();
  });

  // ===== Sound cues (short tones, no files needed) =====
  let audio;
  function beep(kind) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const notes = { ok: [[880, 0], [1320, .09]], dup: [[220, 0], [180, .16]], err: [[300, 0]] }[kind];
      notes.forEach(([freq, delay]) => {
        const o = audio.createOscillator(), g = audio.createGain();
        const start = audio.currentTime + delay, len = kind === 'ok' ? .12 : .2;
        o.type = kind === 'ok' ? 'sine' : 'square';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(kind === 'ok' ? .25 : .08, start + .015);
        g.gain.exponentialRampToValueAtTime(0.0001, start + len);
        o.connect(g).connect(audio.destination);
        o.start(start); o.stop(start + len + .02);
      });
    } catch {}
  }

  // ===== Keep the cursor in the W number box so students (or a scanner) can type any time =====
  input.addEventListener('blur', () => setTimeout(() => {
    if (!isStaffOpen() && (!document.activeElement || document.activeElement === document.body)) input.focus();
  }, 0));
  document.addEventListener('keydown', e => {
    if (isStaffOpen()) { if (e.key === 'Escape') closeStaff(); return; }
    if (document.activeElement !== input && e.key.length === 1 && !e.ctrlKey && !e.metaKey) input.focus();
  });

  function tick() {
    const now = new Date();
    $('today').textContent = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })
      + ' · ' + now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  tick(); setInterval(tick, 10000);
  $('warnbar').hidden = storageOk;
  input.focus();
</script>
</body>
</html>
